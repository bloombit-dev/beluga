name: beluga
version: 0.1
synopsis: Bindings for binary ninja
bug-reports: https://github.com/bloombit/beluga/issues
homepage: https://github.com/bloombit/beluga
category: FFI
license: MIT
author: bloombit
maintainer: hello@bloombit.dev
stability: alpha
tested-with:
  GHC==9.12

description: Bindings and program analysis for binary ninja

extra-source-files:
- README.md
dependencies:
- base >= 4.7 && < 5
- bytestring
- base64-bytestring
- text
- containers >= 0.7
- parallel
- async
library:
  source-dirs: src
  exposed-modules:
    - Binja.AnalysisContext
    - Binja.BinaryView
    - Binja.FFI
    - Binja.Llil
    - Binja.Mlil
    - Binja.Function
    - Binja.BasicBlock
    - Binja.Plugin
    - Binja.ReferenceSource
    - Binja.Symbol
    - Binja.Types.Core
    - Binja.Utils
    - Binja.ControlFlowGraph
    - Callgraph
  ghc-options:
    - -Wall
  ld-options:
    - -Wl,-rpath,${pkgroot}
    - -Wl,-rpath,.
  c-sources:
    - cbits/wrapper.c
  include-dirs:
    - cbits
  extra-libraries:
    - binaryninjacore

tests:
  all:
    main: Test.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    extra-libraries:
      - binaryninjacore
    dependencies:
      - beluga

executables:
  example:
    main: Main.hs
    source-dirs: example
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    extra-libraries:
      - binaryninjacore
    dependencies:
      - beluga
